<div class="p-d-flex p-jc-center p-ai-center min-vh-100">
  <p-card class="login-card w-30">
    <ng-template pTemplate="header">
      <div class="text-center">
        <h1>Teams Login</h1>
      </div>
    </ng-template>

    <!-- Error Messages -->
    <p-messages [(value)]="messages" [enableService]="false" [closable]="false" class="mb-4"></p-messages>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="p-d-flex p-flex-column p-gap-4">
      <!-- Email Field -->
      <div class="p-field">
        <label for="email" class="p-d-block p-mb-2">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full"
        />
        <small class="p-error p-d-block p-mt-1" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </small>
      </div>

      <!-- Password Field -->
      <div class="p-field">
        <label for="password" class="p-d-block p-mb-2">Password</label>
        <input
          pInputText
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full"
        />
        <small class="p-error p-d-block p-mt-1" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </small>
      </div>

      <!-- Submit Button -->
      <button
        pButton
        type="submit"
        label="Login"
        [loading]="isLoading"
        [disabled]="loginForm.invalid || isLoading"
        class="w-full"
      ></button>
    </form>

    <!-- Register Link -->
    <ng-template pTemplate="footer">
      <div class="text-center">
        <p class="p-mb-0">
          Don't have an account?
          <a routerLink="/register" class="font-bold">Register here</a>
        </p>
      </div>
    </ng-template>
  </p-card>
</div>
