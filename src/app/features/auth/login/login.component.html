<div class="auth-page">
  <div class="auth-panel slide-in-up">
    <section class="auth-panel__hero">
      <span class="brand-chip">Teams</span>
      <h1>Welcome Back</h1>
      <p>Sign in to access your team's tasks, chats, and projects.</p>
    </section>

    <p-card class="auth-card">
      <ng-template pTemplate="header">
        <div class="card-header">
          <h2>Login</h2>
          <p>Enter your credentials to continue.</p>
        </div>
      </ng-template>

      <p-messages [(value)]="messages" [enableService]="false" [closable]="false" class="mb-4"></p-messages>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="form-grid">
        <div class="p-field">
          <label for="email" class="field-label">Email</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="w-full"
          />
          <small class="p-error" *ngIf="getFieldError('email')">
            {{ getFieldError('email') }}
          </small>
        </div>

        <div class="p-field">
          <label for="password" class="field-label">Password</label>
          <input
            pInputText
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter your password"
            class="w-full"
          />
          <small class="p-error" *ngIf="getFieldError('password')">
            {{ getFieldError('password') }}
          </small>
        </div>

        <button
          pButton
          type="submit"
          [loading]="isLoading"
          [disabled]="loginForm.invalid || isLoading"
          class="w-full submit-button"
        >
          Login
        </button>
      </form>

      <ng-template pTemplate="footer">
        <div class="footer-text">
          <p>Don't have an account? <a routerLink="/register">Register now</a></p>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>
