<div class="role-dialog">

  <p class="member-label">
    Member: <strong>{{ dialogData.memberName }}</strong>
  </p>

  <div class="field">
    <label for="new-role" class="field-label">New Role</label>
    <p-select
      inputId="new-role"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selectedRole()"
      (ngModelChange)="selectedRole.set($event)"
      class="w-full" />
  </div>

  <div class="form-actions">
    <p-button
      label="Cancel"
      [text]="true"
      severity="secondary"
      (onClick)="cancel()" />
    <p-button
      label="Confirm"
      icon="pi pi-check"
      (onClick)="confirm()" />
  </div>

</div>
