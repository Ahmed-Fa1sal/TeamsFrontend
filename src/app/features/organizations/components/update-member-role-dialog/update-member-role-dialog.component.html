<h2 mat-dialog-title>Change Role</h2>

<mat-dialog-content>
  <div class="role-dialog">
    <p class="member-label">
      Member: <strong>{{ dialogData.memberName }}</strong>
    </p>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>New Role</mat-label>
      <mat-select [ngModel]="selectedRole()" (ngModelChange)="selectedRole.set($event)">
        @for (opt of roleOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()">Cancel</button>
  <button type="button" mat-flat-button color="primary" (click)="confirm()">
    <i class="pi pi-check" aria-hidden="true"></i>
    Confirm
  </button>
</mat-dialog-actions>
