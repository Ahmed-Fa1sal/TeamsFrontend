<form [formGroup]="form" class="add-member-form">

  <div class="field">
    <label for="member-userid" class="field-label">User ID <span class="required">*</span></label>
    <input
      pInputText
      id="member-userid"
      formControlName="userId"
      placeholder="Enter the user's ID"
      class="w-full"
      autocomplete="off" />
    <app-form-error [message]="getError('userId')" />
  </div>

  <div class="field">
    <label for="member-role" class="field-label">Role <span class="required">*</span></label>
    <p-select
      inputId="member-role"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      formControlName="role"
      placeholder="Select a role"
      class="w-full" />
    <app-form-error [message]="getError('role')" />
  </div>

  <div class="form-actions">
    <p-button
      label="Cancel"
      [text]="true"
      severity="secondary"
      (onClick)="cancel()"
      [disabled]="submitting()" />
    <p-button
      label="Add Member"
      [icon]="submitting() ? 'pi pi-spin pi-spinner' : 'pi pi-user-plus'"
      (onClick)="submit()"
      [disabled]="submitting()" />
  </div>

</form>
