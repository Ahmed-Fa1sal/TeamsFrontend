<h2 mat-dialog-title>Add Member</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="add-member-form">

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>User ID</mat-label>
      <input matInput formControlName="userId" placeholder="Enter the user's ID" autocomplete="off" />
      @if (getError('userId')) {
        <mat-error>{{ getError('userId') }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        @for (opt of roleOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
      @if (getError('role')) {
        <mat-error>{{ getError('role') }}</mat-error>
      }
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()" [disabled]="submitting()">Cancel</button>
  <button type="button" mat-flat-button color="primary" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) {
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
    } @else {
      <i class="pi pi-user-plus" aria-hidden="true"></i>
    }
    Add Member
  </button>
</mat-dialog-actions>
