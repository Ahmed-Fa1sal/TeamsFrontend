<h2 mat-dialog-title>{{ isEdit() ? 'Edit Organization' : 'New Organization' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="org-form">

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Organization name" autocomplete="off" />
      @if (getError('name')) {
        <mat-error>{{ getError('name') }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" placeholder="Short description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Logo URL</mat-label>
      <input matInput formControlName="logoUrl" placeholder="https://..." autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Tier</mat-label>
      <mat-select formControlName="tier">
        @for (opt of tierOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
      @if (getError('tier')) {
        <mat-error>{{ getError('tier') }}</mat-error>
      }
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()" [disabled]="submitting()">Cancel</button>
  <button type="button" mat-flat-button color="primary" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) {
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
    } @else {
      <i class="pi pi-check" aria-hidden="true"></i>
    }
    {{ isEdit() ? 'Save Changes' : 'Create' }}
  </button>
</mat-dialog-actions>
